name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Verify migrations apply cleanly from scratch
        env:
          SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Check models and migrations have not drifted apart
        env:
          SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: alembic check

      - name: Tests with coverage floor
        env:
          SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
          ENVIRONMENT: test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend images
        env:
          SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
        run: docker compose build
